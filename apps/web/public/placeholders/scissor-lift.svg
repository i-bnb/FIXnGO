<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0F172A"/>
  <rect x="120" y="40" width="160" height="40" rx="6" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <!-- Scissor cross bars -->
  <line x1="140" y1="80" x2="260" y2="150" stroke="#F59E0B" stroke-width="6"/>
  <line x1="260" y1="80" x2="140" y2="150" stroke="#F59E0B" stroke-width="6"/>
  <line x1="140" y1="150" x2="260" y2="220" stroke="#F59E0B" stroke-width="6"/>
  <line x1="260" y1="150" x2="140" y2="220" stroke="#F59E0B" stroke-width="6"/>
  <!-- Base and wheels -->
  <rect x="100" y="220" width="200" height="30" rx="6" fill="#334155"/>
  <circle cx="120" cy="250" r="16" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
  <circle cx="280" cy="250" r="16" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#E2E8F0" text-anchor="middle">Haulotte 12m Electric Scissor Lift</text>
</svg>
